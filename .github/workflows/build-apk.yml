name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Build web app + copy into Android
        run: |
          ./build.sh
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../JavisGBA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JavisGBA-apk
          path: JavisGBA.apk

      # Publish to a "latest" release so the APK can be downloaded straight from the phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Javis GBA (latest build)
          files: JavisGBA.apk
          make_latest: true
